global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets:
          - host.docker.internal:13080
    metric_relabel_configs:
      - action: labeldrop
        regex: "^container_label_.*$"

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:12345

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets:
          - litellm:4000